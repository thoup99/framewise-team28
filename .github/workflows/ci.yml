name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - name: Install FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev
      - name: Build library
        run: alr -n build
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests
          ./bin/p1_foundation_tests
          ./bin/box_reader_tests
          ./bin/jpeg_header_tests
      - name: CLI runs the example and round-trips the document
        run: |
          cd cli
          alr -n build
          printf 'load ../examples/cut.fw\nlist\ninfo c2\nplan /tmp/out.mp4\nsave /tmp/rt.fw\n' \
            | ./bin/framewise_cli
          ./bin/framewise_cli -c "load /tmp/rt.fw" -c "info m1"
      - name: Export with real ffmpeg on synthetic sources
        run: |
          sudo apt-get install -y ffmpeg
          cd examples
          ffmpeg -loglevel error -y -f lavfi -i testsrc=size=1280x720:rate=30 -t 30 take1.mp4
          ffmpeg -loglevel error -y -f lavfi -i smptebars=size=1280x720:rate=30 -t 20 take2.mp4
          ffmpeg -loglevel error -y -f lavfi -i sine=frequency=440 -t 60 music.wav
          ../cli/bin/framewise_cli -c "load cut.fw" -c "export out.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4 | grep -q '^22\.'
      - name: JPEG reference frame and header
        run: |
          cd examples
          ../cli/bin/framewise_cli -c "load cut.fw" -c "proxy take1"
          ffmpeg -hide_banner -loglevel error -y -i take1.mp4.proxy.mov -frames:v 1 -c:v copy /tmp/framewise-ref.jpg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/framewise-ref.jpg -frames:v 1 -pix_fmt rgba -f rawvideo /tmp/framewise-ref.rgba
          python3 ../scripts/jpeg_reference.py /tmp/framewise-ref.jpg /tmp/framewise-ref.rgba
          ../tests/bin/jpeg_header_tests /tmp/framewise-ref.jpg
      - name: ui/ never reaches below Framewise.Session
        run: |
          ! grep -rEi 'with +Framewise\.(Timeline|Plan|Decode|Commands)' ui/ --include='*.ad?'
      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P framewise.gpr --mode=flow --checks-as-errors=on
